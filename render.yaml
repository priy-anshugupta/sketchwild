services:
  - type: web
    name: sketchwild
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: HOST
        value: 0.0.0.0
      - key: AI_PROVIDER
        value: disabled
      - key: AI_MODEL
        value: gemma3:4b
      - key: DEMO_VIDEO_URL
        value: https://youtu.be/K3OrR_PUB0c
      - key: AI_TIMEOUT_MS
        value: 45000
      - key: AI_IMAGE_MAX_EDGE
        value: 1280
      - key: AI_DAILY_REQUEST_LIMIT
        value: 100
